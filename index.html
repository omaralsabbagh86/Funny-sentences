<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">
    <title>مكوّن الجمل الذكي - V9</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <!-- مكتبات Excel و Word تُحمَّل عند الحاجة فقط (أسرع في الفتح) -->
</head>
<body>

<div class="container">
    <div class="lang-switch">
        <span id="version-badge" class="version-tag"></span>
        <span id="score-badge" class="score-tag" aria-live="polite"></span>
        <button class="icon-btn" id="btn-sound" onclick="toggleSound()" aria-label="sound"></button>
        <button class="theme-toggle-btn" id="btn-theme" onclick="toggleTheme()"></button>
        <button class="lang-btn" id="btn-apk" onclick="installAsAPK()" data-i18n="apk"></button>
        <button class="lang-btn active" id="btn-ar" onclick="setLanguage('ar')">العربية</button>
        <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">English</button>
    </div>

    <h1 id="main-title" data-i18n="title"></h1>

    <div class="tabs" role="tablist">
        <button class="tab-btn active" id="tab-game" role="tab" onclick="switchTab('game')" data-i18n="tabGame"></button>
        <button class="tab-btn" id="tab-io" role="tab" onclick="switchTab('io')" data-i18n="tabIo"></button>
    </div>

    <div id="content-game" class="tab-content active">
        <p class="hint" data-i18n="hint"></p>
        <div class="grid-inputs" id="columns"></div>

        <div class="buttons-panel">
            <button class="btn-mix-current" id="btn-mix-curr" onclick="mixCurrentRound()" data-i18n="mixCurr"></button>
            <button class="btn-mix-all" id="btn-mix-all" onclick="mixAllStorage()" data-i18n="mixAll"></button>
            <button class="btn-copy" id="btn-copy-all" onclick="copyAll()" data-i18n="copyAll"></button>
            <button class="btn-clear" id="btn-clear" onclick="clearAllData()" data-i18n="clear"></button>
            <button class="btn-reload" id="btn-reload" onclick="reloadDefaults()" data-i18n="reload" hidden></button>
        </div>
    </div>

    <div id="content-io" class="tab-content">
        <div class="io-section">
            <h4 data-i18n="sampleTitle"></h4>
            <div class="download-grid">
                <button class="btn-download sample-btn" onclick="downloadSampleExcel('boys')" data-i18n="sampleBoys"></button>
                <button class="btn-download sample-btn" onclick="downloadSampleExcel('girls')" data-i18n="sampleGirls"></button>
                <button class="btn-download sample-btn" onclick="downloadSampleExcel('bodyParts')" data-i18n="sampleBody"></button>
                <button class="btn-download sample-btn" onclick="downloadSampleExcel('verbs')" data-i18n="sampleVerbs"></button>
            </div>
        </div>

        <div class="io-section">
            <h4 data-i18n="uploadTitle"></h4>
            <p class="hint" data-i18n="uploadHint"></p>
            <select id="upload-target" aria-label="target list">
                <option value="boys" data-i18n="optBoys"></option>
                <option value="girls" data-i18n="optGirls"></option>
                <option value="bodyParts" data-i18n="optBody"></option>
                <option value="verbs" data-i18n="optVerbs"></option>
            </select>
            <input type="file" id="file-uploader" accept=".xlsx,.xls,.txt,.csv" onchange="handleUniversalUpload(event)">
        </div>

        <div class="io-section">
            <h4 data-i18n="downloadTitle"></h4>
            <button class="btn-all" onclick="downloadAll()" data-i18n="dlAll"></button>
            <div class="download-grid">
                <button class="btn-download" onclick="downloadTXT()" data-i18n="dlTxt"></button>
                <button class="btn-download" onclick="downloadExcel()" data-i18n="dlExcel"></button>
                <button class="btn-download" onclick="downloadWord()" data-i18n="dlWord"></button>
                <button class="btn-update" onclick="checkForLatestUpdates()" data-i18n="update"></button>
            </div>
        </div>

        <div class="io-section">
            <h4 data-i18n="apkTitle"></h4>
            <p class="hint" data-i18n="apkHint"></p>
            <button class="btn-apk" onclick="downloadAPK()" data-i18n="apkBtn"></button>
        </div>
    </div>
</div>

<div class="results-container">
    <h2 id="result-title"></h2>
    <div id="results-list"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
